services:
  backend:
    profiles: [backend]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lekka-backend
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      secrets:
        - app_env
    container_name: lekka-app
    restart: always
    ports:
      - "127.0.0.1:5174:80"

secrets:
  app_env:
    file: ./app/.env.production
